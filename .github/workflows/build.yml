name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 21
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Create a standard debug keystore on the runner
    - name: Generate Temporary Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # Build while overriding signing configurations to point to the newly created keystore
    - name: Force Build APK
      run: |
        gradle assembleDebug \
          -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
          -Pandroid.injected.signing.store.password=android \
          -Pandroid.injected.signing.key.alias=androiddebugkey \
          -Pandroid.injected.signing.key.password=android

    # Locate and upload whichever .apk file was generated
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4.6.1
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/**/*.apk"
